<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NW Digital City</title>
<style>
  :root {
    color-scheme: dark;
    --ink:        #ffffff;
    --ink-2:      #c3c2b7;
    --ink-muted:  #898781;
    --panel:      rgba(13, 15, 20, 0.82);
    --hairline:   rgba(255, 255, 255, 0.12);
    --good:       #0ca30c;
    --warning:    #fab219;
    --muted-tier: #898781;
    --reactor:    #7fdcff;
    --hotel:      #e60000;
    --house:      #2e9e4f;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: #05070d;
    color: var(--ink);
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
  }
  canvas { display: block; }

  .hud { position: fixed; pointer-events: none; }
  .hud > * { pointer-events: auto; }

  /* ---- title ---- */
  #masthead { top: 20px; left: 20px; max-width: 380px; }
  #masthead h1 {
    margin: 0;
    font-size: 22px;
    font-weight: 650;
    letter-spacing: -0.01em;
  }
  #masthead p {
    margin: 4px 0 0;
    color: var(--ink-2);
    font-size: 13px;
  }

  /* ---- stats strip ---- */
  #stats {
    display: flex;
    gap: 8px;
    margin-top: 14px;
    flex-wrap: wrap;
  }
  #stats .stat {
    min-width: 0;
    white-space: nowrap;
    padding: 9px 13px;
    background: var(--panel);
    border: 1px solid var(--hairline);
    border-radius: 10px;
    backdrop-filter: blur(8px);
  }
  #stats .n {
    display: block;
    font-size: 20px;
    font-weight: 620;
    line-height: 1.1;
  }
  #stats .k {
    display: block;
    font-size: 11px;
    color: var(--ink-muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-top: 3px;
  }

  /* ---- legend ---- */
  #legend {
    bottom: 20px;
    left: 20px;
    width: 320px;
    padding: 16px 18px;
    background: var(--panel);
    border: 1px solid var(--hairline);
    border-radius: 10px;
    backdrop-filter: blur(8px);
  }
  .panel-toggle {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    padding: 0;
    background: none;
    border: 0;
    color: var(--ink-muted);
    font: 600 11px system-ui, sans-serif;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    cursor: pointer;
    text-align: left;
  }
  .panel-toggle:hover { color: var(--ink); }
  .panel-toggle[data-drag] { cursor: grab; }
  .panel-toggle[data-drag]:active { cursor: grabbing; }
  .panel-toggle .caret {
    margin-left: auto;
    font-size: 13px;
    line-height: 1;
    transition: transform 0.18s;
  }
  .collapsed .panel-toggle .caret { transform: rotate(-90deg); }
  .panel-body { margin-top: 10px; }
  .collapsed .panel-body { display: none; }
  .measure { margin-bottom: 12px; }
  .measure:last-child { margin-bottom: 0; }
  .measure .name { font-size: 13px; font-weight: 600; }
  .measure .by { font-size: 12px; color: var(--ink-2); }
  .swatches { display: flex; gap: 6px; align-items: center; margin-top: 5px; flex-wrap: wrap; }
  .sw {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 11px; color: var(--ink-2);
  }
  .sw i {
    width: 10px; height: 10px; border-radius: 2px;
    display: inline-block; flex: none;
  }
  /* Where the city tells two things apart by shape, the legend has to do the
     same. A red square next to a green square does not teach anyone what a
     hotel looks like on the board. */
  .sw svg { display: block; flex: none; }
  .badge {
    display: inline-block;
    margin-left: 6px;
    padding: 1px 6px;
    border-radius: 999px;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    vertical-align: 1px;
  }
  .badge.provisional { background: rgba(250, 178, 25, 0.16); color: var(--warning); }
  .badge.sample      { background: rgba(224, 90, 90, 0.16);  color: #e88; }

  /* ---- inspector ---- */
  #inspector {
    top: 20px;
    right: 356px;
    width: 300px;
    padding: 16px 18px;
    background: var(--panel);
    border: 1px solid var(--hairline);
    border-radius: 10px;
    backdrop-filter: blur(8px);
    display: none;
  }
  #inspector.on { display: block; }
  #inspector .code {
    font-size: 11px;
    letter-spacing: 0.08em;
    color: var(--ink-muted);
    text-transform: uppercase;
  }
  #inspector h3 { margin: 3px 0 2px; font-size: 16px; font-weight: 620; }
  #inspector .panel-toggle { margin-bottom: 2px; }
  #inspector .where { font-size: 12px; color: var(--ink-2); margin-bottom: 10px; }
  #inspector .def {
    font-size: 12px;
    color: var(--ink-2);
    border-top: 1px solid var(--hairline);
    padding-top: 10px;
    margin-top: 10px;
    max-height: 120px;
    overflow-y: auto;
  }
  .rows { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; font-size: 12px; }
  .rows dt { color: var(--ink-muted); }
  .rows dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }

  /* ---- the builder's speech bubble ---- */
  #bubble {
    position: fixed;
    max-width: 260px;
    padding: 9px 13px;
    background: #f7f4ec;
    color: #14161a;
    border-radius: 12px;
    font-size: 13px;
    font-weight: 500;
    line-height: 1.35;
    box-shadow: 0 8px 24px rgba(0,0,0,0.45);
    transform: translate(-50%, -100%);
    opacity: 0;
    transition: opacity 0.25s;
    pointer-events: none;
  }
  #bubble.on { opacity: 1; }
  #bubble::after {
    content: "";
    position: absolute;
    left: 50%;
    bottom: -7px;
    margin-left: -7px;
    border: 7px solid transparent;
    border-top-color: #f7f4ec;
    border-bottom: 0;
  }

  /* ---- what the agent is doing, as it does it ---- */
  #trace {
    top: 20px;
    right: 20px;
    width: 320px;
    padding: 12px 14px;
    background: var(--panel);
    border: 1px solid var(--hairline);
    border-radius: 10px;
    backdrop-filter: blur(8px);
    font-size: 11.5px;
    display: none;
  }
  #trace.on { display: block; }
  #trace h2 { cursor: grab; }
  #trace h2 {
    margin: 0 0 8px;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--ink-muted);
    font-weight: 600;
  }
  #trace .call {
    display: flex;
    gap: 8px;
    align-items: baseline;
    padding: 3px 0;
    border-top: 1px solid rgba(255,255,255,0.06);
    animation: traceIn 0.25s ease-out;
  }
  #trace .call:first-of-type { border-top: 0; }
  @keyframes traceIn { from { opacity: 0; transform: translateX(6px); } }
  #trace .fn {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    color: var(--reactor);
    white-space: nowrap;
  }
  #trace .out { color: var(--ink-2); margin-left: auto; text-align: right; }

  /* ---- ask bar ---- */
  #ask {
    left: 50%;
    bottom: 26px;
    transform: translateX(-50%);
    width: min(620px, 84vw);
    display: flex;
    gap: 8px;
    align-items: center;
    padding: 8px 10px 8px 16px;
    background: rgba(8, 10, 14, 0.92);
    border: 1px solid var(--hairline);
    border-radius: 12px;
    backdrop-filter: blur(10px);
  }
  #ask input {
    flex: 1;
    min-width: 0;
    background: none;
    border: 0;
    outline: 0;
    color: var(--ink);
    font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  #ask input::placeholder { color: #6f6d68; }
  #ask button {
    flex: none;
    padding: 7px 14px;
    background: var(--hotel);
    color: #fff;
    border: 0;
    border-radius: 8px;
    font: 600 13px system-ui, sans-serif;
    cursor: pointer;
  }
  /* Says which model is answering, or that nothing is. Live is a fact worth
     stating on stage; local rules are worth stating honestly. */
  #modelBadge {
    flex: none;
    padding: 4px 9px;
    border-radius: 999px;
    border: 1px solid var(--hairline);
    color: var(--ink-muted);
    font: 11px ui-monospace, "SF Mono", Menlo, monospace;
    white-space: nowrap;
  }
  #modelBadge[data-live="yes"] {
    color: var(--reactor);
    border-color: rgba(127, 220, 255, 0.4);
    background: rgba(127, 220, 255, 0.08);
  }

  #chips {
    left: 50%;
    bottom: 82px;
    transform: translateX(-50%);
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    justify-content: center;
    max-width: min(620px, 84vw);
  }
  #chips button {
    padding: 5px 11px;
    background: rgba(255,255,255,0.07);
    border: 1px solid var(--hairline);
    border-radius: 999px;
    color: var(--ink-2);
    font: 12px system-ui, sans-serif;
    cursor: pointer;
  }
  #chips button:hover { background: rgba(255,255,255,0.14); color: var(--ink); }

  /* ---- lower third: the agent's line, readable from the back of the room ---- */
  #caption {
    left: 50%;
    bottom: 128px;
    transform: translateX(-50%);
    max-width: 900px;
    text-align: center;
    opacity: 0;
    transition: opacity 0.35s;
  }
  #caption.on { opacity: 1; }
  #caption b {
    display: inline-block;
    padding: 12px 24px;
    background: rgba(8, 10, 14, 0.9);
    border: 1px solid var(--hairline);
    border-left: 4px solid var(--hotel);
    border-radius: 8px;
    font-size: 25px;
    font-weight: 600;
    letter-spacing: -0.01em;
    line-height: 1.3;
    backdrop-filter: blur(8px);
  }

  /* ---- hint ---- */
  #hint {
    bottom: 20px;
    right: 20px;
    max-width: 300px;
    padding: 10px 13px;
    background: var(--panel);
    border: 1px solid var(--hairline);
    border-radius: 10px;
    backdrop-filter: blur(8px);
    font-size: 11.5px;
    color: var(--ink-2);
    text-align: right;
  }
  kbd {
    font: inherit;
    background: rgba(255,255,255,0.08);
    border: 1px solid var(--hairline);
    border-radius: 4px;
    padding: 1px 5px;
  }
  #hint .tip { margin-top: 3px; color: var(--ink-muted); }
</style>
</head>
<body>
  <div class="hud" id="masthead">
    <h1>NW Digital City</h1>
    <p id="scope">Vodafone Networks — category blueprint estate</p>
    <div id="stats"></div>
  </div>

  <div class="hud" id="inspector"></div>

  <div class="hud" id="legend">
    <button class="panel-toggle" data-collapse data-drag>How to read the city<span class="caret">&#9662;</span></button>
    <div class="panel-body"><div id="measures"></div></div>
  </div>

  <div id="bubble"></div>

  <div class="hud" id="caption"><b></b></div>

  <div class="hud" id="trace"><h2 data-drag>Agent</h2><div id="calls"></div></div>

  <div class="hud" id="chips"></div>

  <div class="hud" id="ask">
    <input id="askInput" type="text" autocomplete="off" spellcheck="false"
           placeholder="Ask about a category, a district or a market…">
    <span id="modelBadge" hidden></span>
    <button id="askGo">Ask</button>
  </div>

  <div class="hud" id="hint">
    drag to pan · scroll to zoom · <kbd>R</kbd> reset · click a building
    <div class="tip">panel headers can be dragged</div>
  </div>

  <script src="vendor/three.min.js"></script>
  <script src="city-data.js"></script>
  <script src="city.js"></script>
  <script src="agent.js"></script>
</body>
</html>
