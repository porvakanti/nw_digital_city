# NW Digital City: visual configuration
#
# THE PIVOT POINT OF THIS PROJECT.
#
# data/city.json carries EVERY candidate metric for every category. Nothing in
# it is specific to how we choose to draw the city. This file decides which
# metric drives which visual layer, and how values map to tiers.
#
# So if the business view changes -- "market reach is the wrong lens, use spend"
# -- you change one line under `layers:` below. No data rebuild, no code change.
# Legend text, units and tier names all derive from the `metrics:` block, so the
# on-screen explanation can never drift out of sync with what is drawn.

city:
  name: NW Digital City
  scope_label: Vodafone Networks, Level 1 "Network"
  agent_name: Crane           # the agent's display name; change freely
  # What the builder wears on the front of the vest.
  #
  #   a path       an image file in this repository, inlined by the build as
  #                a data URI so it survives into the single-file bundle
  #   speechmark   the speech-mark device drawn as geometry, a fallback that
  #                needs no asset: a white mark on the vest's own red
  #   none         a plain vest
  #   data:image/  an image already inlined as a data URI
  #   anything else  a name, set as text on a badge
  #
  # Keep the asset small. It is base64-encoded into the bundle, it is drawn
  # about a centimetre across on screen, and 128 pixels square is already more
  # than the plate can show.
  vest_mark: renderer/vest-mark.png

# ---------------------------------------------------------------------------
# LAYER BINDINGS. What each visible thing in the city is driven by.
# Each value must name a key from `metrics:` below.
# ---------------------------------------------------------------------------
# Each layer carries two pieces of copy. `caption` is one line, and it is what
# the legend shows: five measures and a paragraph each is a wall of text in a
# corner panel, which nobody reads. `detail` is the full explanation, and it is
# what the explainer and the tour draw on. Neither is written in the renderer,
# so the on-screen words cannot drift from the binding above them.
layers:
  foundation:
    metric: blueprint_state
    caption: Whether the category rules have been captured
    detail: >-
      A lot with no blueprint is bare ground. A drafted one is marked out in
      yellow and carries a faint outline of the building that could stand
      there. An active one has foundations laid, and only then can anything be
      built on it.
  height:
    metric: journey_score     # alternatives: market_reach, cbp_total, ava_adoption
    caption: How far along the journey it has got
    detail: >-
      40 points for writing the blueprint, 35 for anybody using it, 25 for
      doing it with AI. Height rises only once a foundation is laid, so a
      drafted lot shows an outline rather than a building. Past the landmark
      threshold the building is replaced by a monument.
  value:
    metric: spend_eur
    caption: Commercial scale of sourcing activity
    detail: >-
      Houses, then a hotel, in the Monopoly ladder. The thresholds are
      rescaled for this estate: the largest single category is worth
      €75m, so the original ">€100m = hotel" rung could never be reached
      and 84% of categories collapsed into the bottom one.
  occupancy:
    metric: cbp_used
    caption: Whether anybody has used the blueprint
    detail: >-
      A used lot keeps its colour and lights its windows. An unused one is
      drained to grey with the windows dark. A monument follows the same rule:
      washed out if unused, floodlit after dark if used. This is the loudest
      thing in the city, because 52 of the 56 built lots are drained.
  reactor:
    metric: ai_rfps
    caption: Readiness for an AI-drafted brief
    detail: >-
      A reactor on the roof, from dark through a flicker to a full glow with a
      beam over it at night. It marks the categories where rules are
      structured enough for a request for proposal to be generated rather
      than written.

# ---------------------------------------------------------------------------
# THE EXPLAINER
#
# The long-form answer to "what am I looking at", shown in the app behind the
# link at the foot of the legend. Everything about the measures, the score and
# the monuments is generated from the blocks below rather than written out
# again here, so the explanation cannot drift from what is actually drawn.
#
# What is authored here is the framing and the caveats: the part a config
# cannot derive, and the part an audience is entitled to before they draw a
# conclusion from a picture.
# ---------------------------------------------------------------------------
explainer:
  opening: >-
    Every category in the blueprint estate is a lot of land. What stands on
    the lot is how that category is doing. Nothing is decoration: if you can
    see it, it came from the extract, and this page says which field it came
    from.
  ground: >-
    The geography is the category tree. A district is a Level 2 area inside
    its own coloured kerb, a plot is a Level 3 group on the paler slab inside
    it, and a lot is one Level 4 category on one square of land. Lot area
    follows the average spend per category in the plot, square-root
    compressed: the largest plot is 400 times the smallest, so drawn
    literally the small end would be a single pixel. Lots stay uniform inside
    a plot, so an empty one is still countable as an empty one. Street
    traffic follows the same figure, which is why the busiest roads are in
    the districts that spend most.
  caveats:
    - title: There is no time in this data
      body: >-
        No source carries a history, so nothing here shows change. Every
        figure is the position at the extract date and none of it is a trend.
    - title: Adoption depth is not measured
      body: >-
        The intended adoption measure reads a constant 100% across all 145
        categories, so it says nothing and nothing is bound to it. Market
        reach is a count with no denominator: no source states which markets
        a category applies to, so a category live in one market cannot be
        told apart from one that only ever applied to one.
    - title: A score is a summary, and summaries flatter
      body: >-
        The journey score counts stages reached, not value delivered. Two
        categories on the same number can have arrived there by different
        routes, which is why the score is always shown broken into its three
        components and never on its own.
    - title: The people view ranks portfolios, not people
      body: >-
        Nobody chose the categories they hold. A manager carrying three
        untouched categories scores lower than one carrying three that were
        already live, and that is a fact about the portfolio.

# ---------------------------------------------------------------------------
# THE JOURNEY SCORE
#
# One number for a category, a district, a manager or all of Networks, and the
# definition behind Traditional -> Connected -> Smart -> Autonomous.
#
# Weights must total 100. Usage is the heaviest single component on purpose: a
# blueprint nobody uses is paperwork, and the score should say so.
# ---------------------------------------------------------------------------
score:
  weights:
    blueprint: 40
    usage: 35
    ai: 25

  # NOTE: a value containing a comma must be quoted inside these {curly}
  # mappings. Unquoted, YAML reads the comma as the end of the value and the
  # rest as another key: three tier details in this file had silently lost
  # their second clause that way, and the truncated half was on screen.
  #
  # The four stages on the rail, and where each one starts out of 100. A
  # score at or above `from` and below the next stage's `from` is in that
  # stage. These were three expressions inside the renderer, which made the
  # rail the one part of the city a config edit could not move.
  #
  # `detail_org` overrides `detail` for the whole-organisation reading, which
  # needs one extra word the per-category reading must not use: "nobody is
  # here yet" is true of Networks and a flat contradiction on a category
  # sitting at 100.
  # `detail` is the short reading on the rail, where there is room for a few
  # words. `means` is the definition, and it is what the explanation shows: a
  # stage named and not defined is not a definition, which is what a reviewer
  # said about the first version of this table.
  #
  # `detail_zero` overrides `detail` for a score of nought, because drafting a
  # blueprint already scores ten, so nought means there is no blueprint at all
  # and the rail was reading "a blueprint exists" over bare ground.
  stages:
    - id: traditional
      from: 0
      label: Traditional
      detail: a blueprint exists
      detail_zero: no blueprint yet
      means: >-
        Anything short of a blueprint live in more than one market. The
        blueprint is missing, drafted, or live in a single market. Nothing in
        this band has ever been used, because using a blueprint once is worth
        20 marks and would carry all but the emptiest lot out of it.
    - id: connected
      from: 40
      label: Connected
      detail: one blueprint, several markets
      means: >-
        The rules are written and live in several markets, and that is all. 40
        of the 100 marks are for the blueprint alone, so a category arriving
        here has earned every mark available for writing things down and none
        of the marks for anybody acting on them.
    - id: smart
      from: 54
      label: Smart
      detail: in use, and with AI
      means: >-
        The blueprint, plus something real on top of it: a sourcing event run
        through it, worth 20, or a brief generated from its own rules, worth
        15. This is the first band where the estate has done anything with
        what it wrote.
    - id: autonomous
      from: 75
      label: Autonomous
      detail: the whole journey
      detail_org: nobody is here yet
      means: >-
        Written, in repeated use, and generating its own briefs. Every part of
        the journey has happened on the same category. The organisation as a
        whole is nowhere near this, which is the point of showing the rail
        rather than a single number.

  blueprint:                 # how far the blueprint itself has got
    - {id: none,      points: 0,  label: Nothing,        stage: none}
    - {id: drafted,   points: 10, label: Drafted,        stage: traditional}
    - {id: live,      points: 25, label: Live in one market,   stage: traditional}
    - {id: connected, points: 40, label: Live in several markets, stage: connected}

  usage:                     # has anybody actually run one
    - {id: unused,    max: 0,    points: 0,  label: Never used}
    - {id: once,      max: 1,    points: 20, label: Used once}
    - {id: repeated,  max: null, points: 35, label: Used more than once}

  ai:                        # done with AI help
    - {id: none,      max: 0,    points: 0,  label: No AI-generated RFPs}
    - {id: started,   max: 1,    points: 15, label: First AI-generated RFP}
    - {id: several,   max: null, points: 25, label: Several AI-generated RFPs}

  # Rolling many categories into one number. Raw spend lets a single large
  # category carry a district that has done nothing on everything else; equal
  # weighting punishes anyone holding a big portfolio. The square root sits
  # between the two. The floor keeps zero-spend categories counting.
  rollup:
    weight_by: spend_eur
    transform: sqrt
    floor_eur: 1000000
  # Below this many categories a manager is not ranked. One category and one
  # blueprint is a coin toss, not a track record.
  minimum_categories: 3

# ---------------------------------------------------------------------------
# PEOPLE
#
# names | initials | none. One word, and it changes what leaves the build.
# Email addresses are refused at every setting, without exception.
# ---------------------------------------------------------------------------
people:
  show: names
  source_column: VPC Category Manager

# ---------------------------------------------------------------------------
# LANDMARKS
#
# The most reused blueprints get a world landmark, and the rule is that the
# landmark comes from a market that actually adopted that blueprint. So it
# says something rather than just decorating.
# ---------------------------------------------------------------------------
landmarks:
  # Earned by the composite score, not by spread. A blueprint live in many
  # markets and used by none of them is not an achievement, and until this
  # threshold moved it was the thing a monument marked.
  min_score: 50

  # Shown in the legend, so a viewer can name what they are looking at without
  # having to click the lot.
  label: Landmark
  caption: >-
    A monument replaces the building, on a lot widened to hold it

  # Ordered by preference. The highest-scoring category picks first, and takes
  # the first unused monument from the first of its markets that appears here.
  #
  # A market may list several monuments. Germany carries 23 of the 112
  # blueprint records, more than any other market, so it carries more than one
  # high scorer; with a single monument per market the second of them would
  # have been left with nothing.
  #
  # Every shape listed here must be implemented in renderer/city.js. Five were
  # declared and never built, which went unnoticed only because the old
  # threshold happened to need exactly the five that existed.
  by_market:
    UK:
      - {name: Big Ben, shape: clocktower}
    Egypt:
      - {name: The Pyramids, shape: pyramid}
    Italy:
      - {name: The Colosseum, shape: colosseum}
    Greece:
      - {name: The Parthenon, shape: parthenon}
    Germany:
      - {name: Brandenburg Gate, shape: gate}
      - {name: Berlin TV Tower, shape: spire_sphere}
    Turkey:
      - {name: Hagia Sophia, shape: dome}
    Albania:
      - {name: Rozafa Castle, shape: castle}
    Romania:
      - {name: Palace of the Parliament, shape: palace}

# ---------------------------------------------------------------------------
# METRIC REGISTRY
#
# provisional: true  → the UI shows a "provisional measure" marker.
# sample: true       → the UI shows a "sample data" marker. Use this for any
#                      metric that is not yet real. It must be impossible to
#                      present placeholder figures as measured fact.
# ---------------------------------------------------------------------------
metrics:

  blueprint_state:
    label: Blueprint status
    description: Whether a category blueprint exists, and whether it is live.
    kind: categorical
    tiers:
      - {id: none,   value: none,   label: Empty lot,        detail: No blueprint yet. The lot is empty ground.}
      - {id: draft,  value: draft,  label: Lot marked out,   detail: Blueprint drafted. The lot is claimed but has no foundations.}
      - {id: active, value: active, label: Foundation laid,  detail: Blueprint active. The lot can be built on.}

  journey_score:
    label: Journey progress
    description: >
      The composite score, 0 to 100: 40 for how far the blueprint itself has
      got, 35 for anyone actually using it, 25 for doing it with AI. Drives
      building height.

      Chosen over blueprint reach because reach is a count with no denominator.
      A category live in two of the two markets where it applies scores worse
      on reach than one live in five of twenty, and nothing in any source says
      which markets a category applies to. The score counts stages rather than
      markets, so a category can reach the top rung wherever it operates.
    unit: points
    kind: numeric
    # Five rungs over the range the buildable categories actually occupy, which
    # is 25 to 100. The lowest is deliberately three floors rather than one: a
    # live blueprint should read as a building, not as a stub.
    tiers:
      - {id: dormant,      max: 0,    label: Lot prepared,   detail: No blueprint yet.}
      - {id: established,  max: 25,   label: Small building, detail: "Live in one market, and no further."}
      - {id: multi_market, max: 40,   label: Office block,   detail: Live in several markets.}
      - {id: in_use,       max: 64,   label: Tower,          detail: Somebody has run a sourcing event through it.}
      - {id: advanced,     max: 84,   label: High tower,     detail: "In repeated use, and with AI."}
      - {id: complete,     max: null, label: Skyscraper,     detail: At or near the whole journey.}

  market_reach:
    label: Blueprint reach
    description: >
      Number of local markets with a blueprint for this category. Adoption is
      defined as one blueprint per L4 category per local market, so this counts
      how widely the category has actually been taken up.
    unit: markets
    kind: numeric
    # No longer flagged provisional. The flag meant "standing in for AVA
    # Sourcing adoption", which it did while it drove building height. It
    # drives nothing visual now, and a measured column that substitutes for
    # nothing is not provisional. It remains on the title deed and is what a
    # monument is drawn from.
    tiers:
      - {id: plot,       max: 0,    label: Lot prepared,  detail: No market has adopted this blueprint.}
      - {id: small,      max: 1,    label: Small building, detail: Adopted in a single market.}
      - {id: block,      max: 2,    label: Office block,   detail: Adopted in two markets.}
      - {id: tower,      max: 4,    label: Tower,          detail: Adopted across three or four markets.}
      - {id: skyscraper, max: null, label: Skyscraper,     detail: Adopted across five or more markets.}

  ava_adoption:
    label: AVA Sourcing adoption
    description: Share of sourcing for this category run through AVA Sourcing.
    unit: percent
    kind: numeric
    tiers:
      - {id: plot,       max: 0.0,  label: Lot prepared,  detail: No adoption.}
      - {id: small,      max: 0.25, label: Small building, detail: Under 25% adoption.}
      - {id: block,      max: 0.50, label: Office block,   detail: 25 to 50% adoption.}
      - {id: tower,      max: 0.90, label: Tower,          detail: 50 to 90% adoption.}
      - {id: skyscraper, max: null, label: Skyscraper,     detail: Over 90% adoption.}

  cbp_total:
    label: Blueprints created
    description: Total category blueprints for this category, draft and active.
    unit: blueprints
    kind: numeric
    tiers:
      - {id: plot,       max: 0,    label: Lot prepared}
      - {id: small,      max: 1,    label: Small building}
      - {id: block,      max: 3,    label: Office block}
      - {id: tower,      max: 7,    label: Tower}
      - {id: skyscraper, max: null, label: Skyscraper}

  cbp_used:
    label: Blueprints used
    description: >
      How many times a sourcing event has actually been run through this
      category's blueprint. Arrived in the 9 September extract. 44 categories
      have an active blueprint; 4 have one that has ever been used.
    unit: uses
    kind: numeric
    tiers:
      - {id: dark,     max: 0,    label: Nobody has used it, detail: "Built, and empty."}
      - {id: occupied, max: 1,    label: Used once,          detail: Somebody has run one.}
      - {id: busy,     max: null, label: Used repeatedly,    detail: In real service.}

  spend_eur:
    label: Spend FY26/27
    description: >
      Addressable spend for the category. Thresholds are rescaled from the
      original deck to fit the Network distribution. Network's largest single
      category is €75m, so the deck's ">€100m = hotel" rung was unreachable and
      84% of categories collapsed into the bottom rung.
    unit: eur
    kind: numeric
    tiers:
      - {id: none,     max: 0,        label: No recorded spend, pieces: 0}
      - {id: house_1,  max: 1000000,  label: One house,     pieces: 1}
      - {id: house_2,  max: 5000000,  label: Two houses,    pieces: 2}
      - {id: house_3,  max: 20000000, label: Three houses,  pieces: 3}
      - {id: house_4,  max: 50000000, label: Four houses,   pieces: 4}
      - {id: hotel,    max: null,     label: Hotel,         pieces: 5}

  ai_rfps:
    label: AI-generated RFPs
    description: >
      Sourcing events started as AI-generated RFPs. Drives the rooftop reactor.
      A readiness signal only. This is not a claim that autonomous procurement
      is live.

      Measured data. The column was empty in earlier extracts and carried a
      placeholder until then; 8 of 145 categories have any.
    unit: rfps
    kind: numeric
    # Calibrated to the measured range, which is 0 to 2. The earlier four-tier
    # ladder was scaled for the placeholder column, whose values reached 12. On
    # measured data every lit category fell into the lowest lit tier, which
    # drew a small disc and no beam at all, so the layer showed nothing.
    tiers:
      - {id: dark,      max: 0,    label: Dark,          detail: No AI-generated RFP recorded.}
      - {id: flicker,   max: 1,    label: Flicker,       detail: One AI-generated RFP. A first attempt.}
      - {id: reactor,   max: null, label: Full reactor,  detail: Repeated use. Two or more AI-generated RFPs.}

# ---------------------------------------------------------------------------
# Honesty guardrails. The deck is explicit that measure four signals readiness,
# not live autonomy. The wording must not overstate it.
# ---------------------------------------------------------------------------
disclosure:
  show_provisional_badge: true
  show_sample_badge: true
  autonomy_note: A readiness signal. Not a claim that autonomous procurement is live.
