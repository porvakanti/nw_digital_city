# NW Digital City: visual configuration
#
# THE PIVOT POINT OF THIS PROJECT.
#
# data/city.json carries EVERY candidate metric for every category. Nothing in
# it is specific to how we choose to draw the city. This file decides which
# metric drives which visual layer, and how values map to tiers.
#
# So if the business view changes -- "market reach is the wrong lens, use spend"
# -- you change one line under `layers:` below. No data rebuild, no code change.
# Legend text, units and tier names all derive from the `metrics:` block, so the
# on-screen explanation can never drift out of sync with what is drawn.

city:
  name: NW Digital City
  scope_label: Vodafone Networks, Level 1 "Network"
  agent_name: Crane           # the agent's display name; change freely

# ---------------------------------------------------------------------------
# LAYER BINDINGS. What each visible thing in the city is driven by.
# Each value must name a key from `metrics:` below.
# ---------------------------------------------------------------------------
layers:
  foundation:
    metric: blueprint_state
    caption: >-
      Whether the category rules have been captured. An empty lot carries a
      faint outline of the building that could stand there.
  height:
    metric: market_reach      # ← swap to ava_adoption / cbp_total / spend_eur
    caption: >-
      How widely the blueprint has been adopted. Height rises only once a
      foundation is laid; a drafted lot shows an outline instead.
  value:
    metric: spend_eur
    caption: Commercial scale of sourcing activity
  reactor:
    metric: ai_rfps
    caption: Structured rules and future autonomy readiness
  occupancy:
    metric: cbp_used
    caption: >-
      Whether anybody has actually run a sourcing event through the blueprint.
      A built lot with dark windows is a blueprint nobody uses.

# ---------------------------------------------------------------------------
# THE JOURNEY SCORE
#
# One number for a category, a district, a manager or all of Networks, and the
# definition behind Traditional -> Connected -> Smart -> Autonomous.
#
# Weights must total 100. Usage is the heaviest single component on purpose: a
# blueprint nobody uses is paperwork, and the score should say so.
# ---------------------------------------------------------------------------
score:
  weights:
    blueprint: 40
    usage: 35
    ai: 25

  blueprint:                 # how far the blueprint itself has got
    - {id: none,      points: 0,  label: Nothing,        stage: none}
    - {id: drafted,   points: 10, label: Drafted,        stage: traditional}
    - {id: live,      points: 25, label: Live in one market,   stage: traditional}
    - {id: connected, points: 40, label: Live in several markets, stage: connected}

  usage:                     # has anybody actually run one
    - {id: unused,    max: 0,    points: 0,  label: Never used}
    - {id: once,      max: 1,    points: 20, label: Used once}
    - {id: repeated,  max: null, points: 35, label: Used more than once}

  ai:                        # done with AI help
    - {id: none,      max: 0,    points: 0,  label: No AI-generated RFPs}
    - {id: started,   max: 1,    points: 15, label: First AI-generated RFP}
    - {id: several,   max: null, points: 25, label: Several AI-generated RFPs}

  # Rolling many categories into one number. Raw spend lets a single large
  # category carry a district that has done nothing on everything else; equal
  # weighting punishes anyone holding a big portfolio. The square root sits
  # between the two. The floor keeps zero-spend categories counting.
  rollup:
    weight_by: spend_eur
    transform: sqrt
    floor_eur: 1000000
  # Below this many categories a manager is not ranked. One category and one
  # blueprint is a coin toss, not a track record.
  minimum_categories: 3

# ---------------------------------------------------------------------------
# PEOPLE
#
# names | initials | none. One word, and it changes what leaves the build.
# Email addresses are refused at every setting, without exception.
# ---------------------------------------------------------------------------
people:
  show: names
  source_column: VPC Category Manager

# ---------------------------------------------------------------------------
# LANDMARKS
#
# The most reused blueprints get a world landmark, and the rule is that the
# landmark comes from a market that actually adopted that blueprint. So it
# says something rather than just decorating.
# ---------------------------------------------------------------------------
landmarks:
  min_markets: 5
  # Preference order. The first market in this list that adopted the category
  # wins, and each landmark is used once.
  by_market:
    UK: {name: Big Ben, shape: clocktower}
    Egypt: {name: The Pyramids, shape: pyramid}
    Italy: {name: The Colosseum, shape: colosseum}
    Greece: {name: The Parthenon, shape: parthenon}
    Germany: {name: Brandenburg Gate, shape: gate}
    Spain: {name: Sagrada Familia, shape: spires}
    Turkey: {name: Hagia Sophia, shape: dome}
    Portugal: {name: Belem Tower, shape: tower}
    Ireland: {name: Ha'penny Bridge, shape: bridge}
    South Africa: {name: Table Mountain, shape: mesa}

# ---------------------------------------------------------------------------
# METRIC REGISTRY
#
# provisional: true  → the UI shows a "provisional measure" marker.
# sample: true       → the UI shows a "sample data" marker. Use this for any
#                      metric that is not yet real. It must be impossible to
#                      present placeholder figures as measured fact.
# ---------------------------------------------------------------------------
metrics:

  blueprint_state:
    label: Blueprint status
    description: Whether a category blueprint exists, and whether it is live.
    kind: categorical
    tiers:
      - {id: none,   value: none,   label: Empty lot,        detail: No blueprint yet. The lot is empty ground.}
      - {id: draft,  value: draft,  label: Lot marked out,   detail: Blueprint drafted. The lot is claimed but has no foundations.}
      - {id: active, value: active, label: Foundation laid,  detail: Blueprint active. The lot can be built on.}

  market_reach:
    label: Blueprint reach
    description: >
      Number of local markets with a blueprint for this category. Adoption is
      defined as one blueprint per L4 category per local market, so this counts
      how widely the category has actually been taken up.
    unit: markets
    kind: numeric
    provisional: true
    provisional_note: >
      Standing in for AVA Sourcing adoption, which reads a flat 100% for every
      category in the current extract and so cannot differentiate the skyline.
    tiers:
      - {id: plot,       max: 0,    label: Lot prepared,  detail: No market has adopted this blueprint.}
      - {id: small,      max: 1,    label: Small building, detail: Adopted in a single market.}
      - {id: block,      max: 2,    label: Office block,   detail: Adopted in two markets.}
      - {id: tower,      max: 4,    label: Tower,          detail: Adopted across three or four markets.}
      - {id: skyscraper, max: null, label: Skyscraper,     detail: Adopted across five or more markets.}

  ava_adoption:
    label: AVA Sourcing adoption
    description: Share of sourcing for this category run through AVA Sourcing.
    unit: percent
    kind: numeric
    tiers:
      - {id: plot,       max: 0.0,  label: Lot prepared,  detail: No adoption.}
      - {id: small,      max: 0.25, label: Small building, detail: Under 25% adoption.}
      - {id: block,      max: 0.50, label: Office block,   detail: 25 to 50% adoption.}
      - {id: tower,      max: 0.90, label: Tower,          detail: 50 to 90% adoption.}
      - {id: skyscraper, max: null, label: Skyscraper,     detail: Over 90% adoption.}

  cbp_total:
    label: Blueprints created
    description: Total category blueprints for this category, draft and active.
    unit: blueprints
    kind: numeric
    tiers:
      - {id: plot,       max: 0,    label: Lot prepared}
      - {id: small,      max: 1,    label: Small building}
      - {id: block,      max: 3,    label: Office block}
      - {id: tower,      max: 7,    label: Tower}
      - {id: skyscraper, max: null, label: Skyscraper}

  cbp_used:
    label: Blueprints used
    description: >
      How many times a sourcing event has actually been run through this
      category's blueprint. Arrived in the 9 September extract. 44 categories
      have an active blueprint; 4 have one that has ever been used.
    unit: uses
    kind: numeric
    tiers:
      - {id: dark,     max: 0,    label: Nobody has used it, detail: Built, and empty.}
      - {id: occupied, max: 1,    label: Used once,          detail: Somebody has run one.}
      - {id: busy,     max: null, label: Used repeatedly,    detail: In real service.}

  spend_eur:
    label: Spend FY26/27
    description: >
      Addressable spend for the category. Thresholds are rescaled from the
      original deck to fit the Network distribution. Network's largest single
      category is €75m, so the deck's ">€100m = hotel" rung was unreachable and
      84% of categories collapsed into the bottom rung.
    unit: eur
    kind: numeric
    tiers:
      - {id: none,     max: 0,        label: No recorded spend, pieces: 0}
      - {id: house_1,  max: 1000000,  label: One house,     pieces: 1}
      - {id: house_2,  max: 5000000,  label: Two houses,    pieces: 2}
      - {id: house_3,  max: 20000000, label: Three houses,  pieces: 3}
      - {id: house_4,  max: 50000000, label: Four houses,   pieces: 4}
      - {id: hotel,    max: null,     label: Hotel,         pieces: 5}

  ai_rfps:
    label: AI-generated RFPs
    description: >
      Sourcing events started as AI-generated RFPs. Drives the rooftop reactor.
      A readiness signal only. This is not a claim that autonomous procurement
      is live.

      Measured data. The column was empty in earlier extracts and carried a
      placeholder until then; 8 of 145 categories have any.
    unit: rfps
    kind: numeric
    # Calibrated to the measured range, which is 0 to 2. The earlier four-tier
    # ladder was scaled for the placeholder column, whose values reached 12. On
    # measured data every lit category fell into the lowest lit tier, which
    # drew a small disc and no beam at all, so the layer showed nothing.
    tiers:
      - {id: dark,      max: 0,    label: Dark,          detail: No AI-generated RFP recorded.}
      - {id: flicker,   max: 1,    label: Flicker,       detail: One AI-generated RFP. A first attempt.}
      - {id: reactor,   max: null, label: Full reactor,  detail: Repeated use. Two or more AI-generated RFPs.}

# ---------------------------------------------------------------------------
# Honesty guardrails. The deck is explicit that measure four signals readiness,
# not live autonomy. The wording must not overstate it.
# ---------------------------------------------------------------------------
disclosure:
  show_provisional_badge: true
  show_sample_badge: true
  autonomy_note: A readiness signal. Not a claim that autonomous procurement is live.
