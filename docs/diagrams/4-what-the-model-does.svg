<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" font-family="Helvetica, Arial, sans-serif">
  <rect width="880" height="340" fill="#fcfcfb"/>
  <text x="28" y="40" font-size="19" font-weight="bold" fill="#1b1e24">What the model does, and does not, see</text>
  <text x="28" y="62" font-size="13.5" fill="#5d6873">It picks what you meant. It never gets a figure, and never gives one back.</text>

  <defs>
    <marker id="d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1b1e24"/>
    </marker>
  </defs>

  <!-- the browser side -->
  <rect x="28" y="90" width="330" height="215" rx="4" fill="#ffffff" stroke="#1b1e24" stroke-width="1.6"/>
  <text x="46" y="114" font-size="13.5" font-weight="bold" fill="#1b1e24">Everything real, in the browser</text>
  <text x="46" y="142" font-size="12.5" fill="#5d6873">The figures for all 145 categories</text>
  <text x="46" y="164" font-size="12.5" fill="#5d6873">The journey score, as a formula</text>
  <text x="46" y="186" font-size="12.5" fill="#5d6873">Which lot is where, and how big</text>
  <text x="46" y="208" font-size="12.5" fill="#5d6873">The sentence it reads out</text>
  <text x="46" y="244" font-size="13" fill="#c00000" font-weight="bold">Every number on screen is</text>
  <text x="46" y="262" font-size="13" fill="#c00000" font-weight="bold">worked out in here.</text>
  <text x="46" y="288" font-size="12" fill="#5d6873">Same answer every single time.</text>

  <!-- the boundary -->
  <line x1="460" y1="84" x2="460" y2="316" stroke="#c00000" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="460" y="76" font-size="11.5" fill="#c00000" text-anchor="middle" font-weight="bold" letter-spacing="1">THE LAPTOP ENDS HERE</text>

  <!-- the model side -->
  <rect x="580" y="140" width="272" height="104" rx="4" fill="none" stroke="#1b1e24" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="716" y="174" font-size="14.5" fill="#1b1e24" text-anchor="middle" font-weight="bold">The model</text>
  <text x="716" y="198" font-size="12.5" fill="#5d6873" text-anchor="middle">Reads the question and says</text>
  <text x="716" y="216" font-size="12.5" fill="#5d6873" text-anchor="middle">which of 11 things you meant,</text>
  <text x="716" y="234" font-size="12.5" fill="#5d6873" text-anchor="middle">and where you meant it.</text>

  <g fill="#fcfcfb">
    <rect x="352" y="110" width="228" height="17"/>
    <rect x="400" y="140" width="132" height="17"/>
    <rect x="370" y="242" width="196" height="17"/>
    <rect x="380" y="272" width="176" height="17"/>
  </g>
  <line x1="358" y1="130" x2="574" y2="130" stroke="#1b1e24" stroke-width="1.6" marker-end="url(#d)"/>
  <text x="466" y="122" font-size="12" fill="#5d6873" text-anchor="middle">your words, and 145 category names</text>
  <text x="466" y="152" font-size="12" fill="#c00000" text-anchor="middle" font-weight="bold">no figures go out</text>

  <line x1="574" y1="262" x2="362" y2="262" stroke="#1b1e24" stroke-width="1.6" marker-end="url(#d)"/>
  <text x="468" y="254" font-size="12" fill="#5d6873" text-anchor="middle">"show the people leaderboard"</text>
  <text x="468" y="284" font-size="12" fill="#c00000" text-anchor="middle" font-weight="bold">any digit is thrown away</text>
</svg>
