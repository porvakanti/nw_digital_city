<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360" font-family="Helvetica, Arial, sans-serif">
  <rect width="880" height="360" fill="#fcfcfb"/>
  <text x="28" y="40" font-size="19" font-weight="bold" fill="#1b1e24">What is inside the city</text>
  <text x="28" y="62" font-size="13.5" fill="#5d6873">Three parts. Only the third one ever touches the network.</text>

  <defs>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1b1e24"/>
    </marker>
    <marker id="bd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#9a6b00"/>
    </marker>
  </defs>

  <!-- the browser frame -->
  <rect x="28" y="90" width="600" height="235" rx="4" fill="none" stroke="#1b1e24" stroke-width="1.6"/>
  <text x="44" y="112" font-size="11.5" font-weight="bold" fill="#5d6873" letter-spacing="1.2">ONE BROWSER TAB, NOTHING INSTALLED</text>

  <!-- 1. the data -->
  <rect x="48" y="128" width="170" height="86" rx="3" fill="#ffffff" stroke="#1b1e24" stroke-width="1.6"/>
  <text x="60" y="150" font-size="12" fill="#9a6b00" font-weight="bold">1</text>
  <text x="133" y="166" font-size="14.5" fill="#1b1e24" text-anchor="middle" font-weight="bold">The figures</text>
  <text x="133" y="186" font-size="11.5" fill="#5d6873" text-anchor="middle">baked into the page</text>
  <text x="133" y="202" font-size="11.5" fill="#5d6873" text-anchor="middle">no database, no API</text>

  <!-- 2. the picture -->
  <rect x="248" y="128" width="170" height="86" rx="3" fill="#ffffff" stroke="#1b1e24" stroke-width="1.6"/>
  <text x="260" y="150" font-size="12" fill="#9a6b00" font-weight="bold">2</text>
  <text x="333" y="166" font-size="14.5" fill="#1b1e24" text-anchor="middle" font-weight="bold">The picture</text>
  <text x="333" y="186" font-size="11.5" fill="#5d6873" text-anchor="middle">drawn in 3D here</text>
  <text x="333" y="202" font-size="11.5" fill="#5d6873" text-anchor="middle">every number too</text>

  <!-- 3. the question box -->
  <rect x="448" y="128" width="160" height="86" rx="3" fill="#fdf8ea" stroke="#9a6b00" stroke-width="1.8"/>
  <text x="460" y="150" font-size="12" fill="#9a6b00" font-weight="bold">3</text>
  <text x="528" y="166" font-size="14.5" fill="#1b1e24" text-anchor="middle" font-weight="bold">The question box</text>
  <text x="528" y="186" font-size="11.5" fill="#5d6873" text-anchor="middle">type in English</text>
  <text x="528" y="202" font-size="11.5" fill="#5d6873" text-anchor="middle">it moves the city</text>

  <line x1="218" y1="171" x2="242" y2="171" stroke="#1b1e24" stroke-width="1.6" marker-end="url(#b)"/>
  <line x1="448" y1="171" x2="424" y2="171" stroke="#1b1e24" stroke-width="1.6" marker-end="url(#b)"/>

  <text x="48" y="252" font-size="13" fill="#1b1e24" font-weight="bold">Parts 1 and 2 are the whole show.</text>
  <text x="48" y="272" font-size="12.5" fill="#5d6873">If the wifi dies, the city still opens, still draws, still answers.</text>
  <text x="48" y="298" font-size="12.5" fill="#5d6873">Part 3 works on its own rules too. A model just makes it more forgiving</text>
  <text x="48" y="315" font-size="12.5" fill="#5d6873">about how loosely you phrase the question.</text>

  <!-- the optional model -->
  <rect x="676" y="150" width="176" height="72" rx="3" fill="none" stroke="#9a6b00" stroke-width="1.8" stroke-dasharray="6 4"/>
  <text x="764" y="180" font-size="14.5" fill="#1b1e24" text-anchor="middle" font-weight="bold">A language model</text>
  <text x="764" y="200" font-size="11.5" fill="#5d6873" text-anchor="middle">optional, and today</text>
  <text x="764" y="215" font-size="11.5" fill="#5d6873" text-anchor="middle">a personal API key</text>

  <path d="M608 160 L642 160 L642 172 L670 172" fill="none" stroke="#9a6b00" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#bd)"/>
  <path d="M670 200 L642 200 L642 190 L608 190" fill="none" stroke="#9a6b00" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#bd)"/>
  <text x="676" y="252" font-size="12" fill="#9a6b00" font-weight="bold">Dashed = allowed to fail.</text>
  <text x="676" y="270" font-size="12" fill="#5d6873">Nothing else depends on it.</text>
</svg>
