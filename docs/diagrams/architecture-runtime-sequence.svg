<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" font-family="Helvetica, Arial, sans-serif">
  <rect width="900" height="500" fill="#fcfcfb"/>
  <defs>
    <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1b1e24"/>
    </marker>
  </defs>
  <text x="28" y="38" font-size="18" font-weight="bold" fill="#1b1e24">Runtime sequence: a natural-language query</text>
  <text x="28" y="58" font-size="12.5" fill="#55606b">Steps 2 to 6 are skipped when no service tier is reachable.</text>

  <g font-size="12" fill="#1b1e24">
    <rect x="30" y="76" width="118" height="36" rx="2" fill="#ffffff" stroke="#1b1e24" stroke-width="1.3"/>
    <text x="89" y="99" text-anchor="middle" font-weight="bold">User</text>
    <rect x="186" y="76" width="118" height="36" rx="2" fill="#ffffff" stroke="#1b1e24" stroke-width="1.3"/>
    <text x="245" y="99" text-anchor="middle" font-weight="bold">agent.js</text>
    <rect x="352" y="76" width="118" height="36" rx="2" fill="#ffffff" stroke="#1b1e24" stroke-width="1.3"/>
    <text x="411" y="99" text-anchor="middle" font-weight="bold">POST /plan</text>
    <rect x="524" y="76" width="146" height="36" rx="2" fill="#ffffff" stroke="#55606b" stroke-width="1.3" stroke-dasharray="5 3"/>
    <text x="597" y="99" text-anchor="middle" font-weight="bold">LLM endpoint</text>
    <rect x="726" y="76" width="118" height="36" rx="2" fill="#ffffff" stroke="#1b1e24" stroke-width="1.3"/>
    <text x="785" y="99" text-anchor="middle" font-weight="bold">city.js</text>
  </g>

  <g stroke="#b6bdb7" stroke-width="1.2" stroke-dasharray="4 4">
    <line x1="89" y1="112" x2="89" y2="466"/>
    <line x1="245" y1="112" x2="245" y2="466"/>
    <line x1="411" y1="112" x2="411" y2="466"/>
    <line x1="597" y1="112" x2="597" y2="466"/>
    <line x1="785" y1="112" x2="785" y2="466"/>
  </g>

  <g font-size="11" fill="#55606b" font-family="Helvetica, Arial, sans-serif">
    <g stroke="#1b1e24" stroke-width="1.3" marker-end="url(#m)" fill="none">
      <line x1="89" y1="146" x2="241" y2="146"/>
      <line x1="245" y1="192" x2="407" y2="192"/>
      <line x1="411" y1="230" x2="593" y2="230"/>
    </g>
    <g stroke="#1b1e24" stroke-width="1.3" marker-end="url(#m)" fill="none" stroke-dasharray="5 3">
      <line x1="597" y1="268" x2="415" y2="268"/>
      <line x1="411" y1="346" x2="249" y2="346"/>
    </g>
    <g stroke="#1b1e24" stroke-width="1.3" marker-end="url(#m)" fill="none">
      <line x1="245" y1="424" x2="781" y2="424"/>
    </g>
    <g stroke="#1b1e24" stroke-width="1.3" marker-end="url(#m)" fill="none" stroke-dasharray="5 3">
      <line x1="785" y1="458" x2="93" y2="458"/>
    </g>

    <text x="95" y="138" font-weight="bold" fill="#1b1e24">1</text><text x="110" y="138">query text</text>
    <text x="251" y="184" font-weight="bold" fill="#1b1e24">2</text><text x="266" y="184">{ question, vocabulary: 145 category names, 8 districts, 31 plots, 21 markets }</text>
    <text x="417" y="222" font-weight="bold" fill="#1b1e24">3</text><text x="432" y="222">system prompt + vocabulary</text>
    <text x="417" y="260" font-weight="bold" fill="#1b1e24">4</text><text x="432" y="260">candidate intent and target, as JSON</text>

    <rect x="352" y="286" width="230" height="44" rx="2" fill="#f2f4f2" stroke="#1b1e24" stroke-width="1.2"/>
    <text x="417" y="303" font-weight="bold" fill="#1b1e24">5</text>
    <text x="432" y="303" fill="#1b1e24">validate</text>
    <text x="362" y="320">unknown targets dropped, numerics stripped</text>

    <text x="255" y="338" font-weight="bold" fill="#1b1e24">6</text><text x="270" y="338">validated plan, or intent "unknown"</text>

    <rect x="186" y="362" width="248" height="44" rx="2" fill="#f2f4f2" stroke="#1b1e24" stroke-width="1.2"/>
    <text x="196" y="379" font-weight="bold" fill="#1b1e24">7</text>
    <text x="211" y="379" fill="#1b1e24">select tool sequence</text>
    <text x="196" y="396">from the plan, or from local rules if absent</text>

    <text x="251" y="416" font-weight="bold" fill="#1b1e24">8</text><text x="266" y="416">tool calls: find_category, rank, leaders, render</text>
    <text x="99" y="450" font-weight="bold" fill="#1b1e24">9</text><text x="114" y="450">camera transition, geometry rebuild, caption. Every displayed figure computed here.</text>
  </g>
</svg>
