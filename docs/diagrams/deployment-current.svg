<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" font-family="Helvetica, Arial, sans-serif">
  <rect width="900" height="430" fill="#fcfcfb"/>
  <defs>
    <marker id="c1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1b1e24"/>
    </marker>
  </defs>
  <text x="28" y="38" font-size="18" font-weight="bold" fill="#1b1e24">Deployment: current state</text>
  <text x="28" y="58" font-size="12.5" fill="#55606b">Single host. The model is reached with an API key held in a local configuration file.</text>

  <!-- host boundary -->
  <rect x="28" y="82" width="500" height="234" rx="3" fill="#f2f4f2" stroke="#1b1e24" stroke-width="1.4"/>
  <text x="44" y="102" font-size="11" font-weight="bold" fill="#55606b" letter-spacing="1.1">SINGLE HOST</text>

  <rect x="46" y="116" width="210" height="58" rx="2" fill="#ffffff" stroke="#1b1e24" stroke-width="1.3"/>
  <text x="151" y="138" font-size="13" fill="#1b1e24" text-anchor="middle" font-weight="bold">Browser</text>
  <text x="151" y="155" font-size="11" fill="#55606b" text-anchor="middle">http://127.0.0.1:8099</text>

  <rect x="290" y="116" width="220" height="58" rx="2" fill="#ffffff" stroke="#1b1e24" stroke-width="1.3"/>
  <text x="400" y="138" font-size="13" fill="#1b1e24" text-anchor="middle" font-weight="bold">uvicorn + FastAPI</text>
  <text x="400" y="155" font-size="11" fill="#55606b" text-anchor="middle">static renderer, /plan, /health</text>

  <rect x="290" y="196" width="220" height="58" rx="2" fill="#fdeeee" stroke="#b3261e" stroke-width="1.6"/>
  <text x="400" y="218" font-size="13" fill="#1b1e24" text-anchor="middle" font-weight="bold">.env</text>
  <text x="400" y="235" font-size="11" fill="#b3261e" text-anchor="middle">NW_API_KEY, file-based secret</text>

  <line x1="256" y1="145" x2="284" y2="145" stroke="#1b1e24" stroke-width="1.3" marker-end="url(#c1)" marker-start="url(#c1)"/>
  <line x1="400" y1="196" x2="400" y2="178" stroke="#1b1e24" stroke-width="1.3" marker-end="url(#c1)"/>

  <text x="46" y="284" font-size="11.5" fill="#55606b">Alternative distribution: a single inlined HTML document, with no service tier</text>
  <text x="46" y="300" font-size="11.5" fill="#55606b">and therefore no model. Routing falls back to the deterministic rules.</text>

  <!-- external -->
  <rect x="576" y="82" width="296" height="234" rx="3" fill="none" stroke="#55606b" stroke-width="1.4" stroke-dasharray="5 3"/>
  <text x="592" y="102" font-size="11" font-weight="bold" fill="#55606b" letter-spacing="1.1">GOOGLE, PUBLIC INTERNET</text>
  <rect x="594" y="116" width="260" height="72" rx="2" fill="#ffffff" stroke="#55606b" stroke-width="1.3"/>
  <text x="724" y="140" font-size="13" fill="#1b1e24" text-anchor="middle" font-weight="bold">Generative Language API</text>
  <text x="724" y="157" font-size="11" fill="#55606b" text-anchor="middle">generativelanguage.googleapis.com</text>
  <text x="724" y="174" font-size="11" fill="#55606b" text-anchor="middle">authenticated by API key</text>

  <line x1="510" y1="145" x2="588" y2="145" stroke="#1b1e24" stroke-width="1.3" marker-end="url(#c1)" marker-start="url(#c1)"/>
  <text x="549" y="137" font-size="10.5" fill="#55606b" text-anchor="middle">HTTPS</text>

  <text x="594" y="212" font-size="11.5" fill="#55606b">Quota is attached to the key, not to an</text>
  <text x="594" y="228" font-size="11.5" fill="#55606b">organisation. A model ladder falls through</text>
  <text x="594" y="244" font-size="11.5" fill="#55606b">on 404, 429 and 503, and finally to the</text>
  <text x="594" y="260" font-size="11.5" fill="#55606b">deterministic rules.</text>

  <rect x="28" y="336" width="844" height="72" rx="2" fill="#fdeeee" stroke="#b3261e" stroke-width="1.2"/>
  <text x="44" y="356" font-size="11" font-weight="bold" fill="#b3261e" letter-spacing="1.1">CONSTRAINTS OF THIS STATE</text>
  <text x="44" y="375" font-size="11.5" fill="#55606b">The credential is a personal API key in a file, outside organisational identity and key management. Quota is</text>
  <text x="44" y="391" font-size="11.5" fill="#55606b">per key and unsuitable for concurrent use. The host is not addressable by other users, so there is no URL to</text>
  <text x="44" y="403" font-size="11.5" fill="#55606b">publish. Suitable for development only.</text>
</svg>
